<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful | City Life Cars</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      width: 90%;
      max-width: 520px;
      padding: 45px 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.10);
    }
    .check {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #e8f7ed;
      color: #18864b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: bold;
    }
    h1 {
      margin-bottom: 10px;
    }
    p {
      line-height: 1.6;
      color: #5d6470;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 24px;
      background: #172033;
      color: white;
      text-decoration: none;
      border-radius: 9px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="check">✓</div>

    <h1>Payment Successful!</h1>

    <p>
      Your rental deposit has been received.
    </p>

    <p>
      Thank you for choosing <strong>City Life Cars</strong>.
      Your reservation is being processed and your rental details
      will be confirmed.
    </p>

    <a href="/">Return to City Life Cars</a>
  </div>

</body>
</html>
